name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        run: dotnet build app/OpenEVision.csproj -c Release -nologo

      - name: Test (Debug, uses the simulated keyboard)
        run: dotnet test tests/OpenEVision.Tests/OpenEVision.Tests.csproj -c Debug -nologo

      - name: Publish check (self-contained single file)
        run: dotnet publish app/OpenEVision.csproj -c Release -nologo -o dist
